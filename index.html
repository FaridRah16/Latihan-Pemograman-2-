<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aksi Hijau - Komunitas Pemuda Tangsel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .page-transition { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for premium look */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <!-- Navigation Bar -->
    <nav class="fixed top-0 w-full bg-white/90 backdrop-blur-md z-50 border-b border-emerald-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-2 cursor-pointer" onclick="navigateTo('home')">
                    <div class="bg-emerald-600 p-2 rounded-lg">
                        <i data-lucide="leaf" class="text-white w-6 h-6"></i>
                    </div>
                    <span class="text-2xl font-bold text-slate-800 tracking-tight">Aksi<span class="text-emerald-600">Hijau</span></span>
                </div>

                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-8" id="desktop-nav">
                    <!-- Dynamic menu will be injected here -->
                </div>

                <!-- Mobile Toggle -->
                <div class="md:hidden">
                    <button onclick="toggleMobileMenu()" class="p-2 text-slate-600">
                        <i data-lucide="menu" id="menu-icon"></i>
                    </button>
                </div>
            </div>
        </div>
        
        <!-- Mobile Menu -->
        <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-slate-100 p-4 space-y-4">
            <!-- Dynamic mobile menu will be injected here -->
        </div>
    </nav>

    <!-- Main Content Area -->
    <main id="app-content" class="min-h-screen"></main>

    <!-- Toast Notification -->
    <div id="notification-container" class="fixed bottom-6 left-6 z-[100] space-y-3"></div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 pt-20 pb-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid md:grid-cols-4 gap-12 mb-16">
                <div>
                    <div class="flex items-center gap-2 mb-6">
                        <div class="bg-emerald-600 p-1.5 rounded-lg">
                            <i data-lucide="leaf" class="text-white w-5 h-5"></i>
                        </div>
                        <span class="text-xl font-bold">Aksi<span class="text-emerald-600">Hijau</span></span>
                    </div>
                    <p class="text-slate-500 text-sm leading-relaxed">Komunitas pemuda Tangerang Selatan yang berdedikasi untuk bumi.</p>
                </div>
                <div>
                    <h4 class="font-bold mb-6">Program</h4>
                    <ul class="space-y-4 text-sm text-slate-500">
                        <li class="hover:text-emerald-600 cursor-pointer">Mangrove</li>
                        <li class="hover:text-emerald-600 cursor-pointer">Zero Waste</li>
                        <li class="hover:text-emerald-600 cursor-pointer">Edu-Trip</li>
                    </ul>
                </div>
                <div>
                    <h4 class="font-bold mb-6">Bantuan</h4>
                    <ul class="space-y-4 text-sm text-slate-500">
                        <li class="hover:text-emerald-600 cursor-pointer">Hubungi Kami</li>
                        <li class="hover:text-emerald-600 cursor-pointer">Donasi FAQ</li>
                    </ul>
                </div>
                <div>
                    <h4 class="font-bold mb-6">Sosial Media</h4>
                    <div class="flex gap-4">
                        <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center hover:bg-emerald-50 cursor-pointer"><i data-lucide="instagram" class="w-5 h-5"></i></div>
                        <div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center hover:bg-emerald-50 cursor-pointer"><i data-lucide="twitter" class="w-5 h-5"></i></div>
                    </div>
                </div>
            </div>
            <div class="border-t border-slate-50 pt-8 text-center text-xs text-slate-400">
                © 2024 Aksi Hijau Tangsel. Dibuat untuk masa depan yang lebih hijau.
            </div>
        </div>
    </footer>

    <script>
        // --- DATA & STATE ---
        let currentUser = JSON.parse(localStorage.getItem('aksi_hijau_user')) || null;
        let isMenuOpen = false;

        const MOCK_PROJECTS = [
            { id: 1, title: "Penanaman 1000 Mangrove", loc: "Pesisir Tangerang", target: 50000000, collected: 32500000, img: "https://images.unsplash.com/photo-1584564718412-472b6151f502?q=80&w=800&auto=format&fit=crop" },
            { id: 2, title: "Workshop Zero Waste Tangsel", loc: "Serpong", target: 15000000, collected: 8200000, img: "https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?q=80&w=800&auto=format&fit=crop" },
            { id: 3, title: "Bank Sampah Digital", loc: "Ciputat", target: 25000000, collected: 21000000, img: "https://images.unsplash.com/photo-1611284446314-60a58ac0deb9?q=80&w=800&auto=format&fit=crop" }
        ];

        // --- NAVIGATION LOGIC ---
        function navigateTo(page) {
            const content = document.getElementById('app-content');
            isMenuOpen = false;
            updateNavbar();
            
            let html = '';
            
            switch(page) {
                case 'home': html = renderHome(); break;
                case 'projects': html = renderProjects(); break;
                case 'education': html = renderEducation(); break;
                case 'login': html = renderAuth(false); break;
                case 'register': html = renderAuth(true); break;
                case 'dashboard': html = renderDashboard(); break;
                default: html = renderHome();
            }

            content.innerHTML = `<div class="page-transition">${html}</div>`;
            window.scrollTo(0, 0);
            lucide.createIcons(); // Re-initialize icons
        }

        // --- UI RENDERING FUNCTIONS ---
        function renderHome() {
            return `
                <section class="pt-32 pb-20 bg-slate-50">
                    <div class="max-w-7xl mx-auto px-4 lg:flex items-center gap-12">
                        <div class="lg:w-1/2 mb-12 lg:mb-0">
                            <span class="bg-emerald-100 text-emerald-700 px-4 py-1.5 rounded-full text-sm font-bold mb-6 inline-block">Pemuda Tangsel Bergerak</span>
                            <h1 class="text-5xl lg:text-7xl font-extrabold mb-6 leading-tight">Wujudkan Kota <span class="text-emerald-600">Lebih Hijau</span>.</h1>
                            <p class="text-lg text-slate-600 mb-8">Platform crowdfunding aksi lingkungan khusus pemuda di Tangerang Selatan. Mulai dari mangrove hingga edukasi sampah.</p>
                            <div class="flex flex-wrap gap-4">
                                <button onclick="navigateTo('projects')" class="bg-emerald-600 text-white px-8 py-4 rounded-2xl font-bold hover:bg-emerald-700 shadow-xl shadow-emerald-100">Donasi Sekarang</button>
                                <button onclick="navigateTo('education')" class="bg-white border border-slate-200 px-8 py-4 rounded-2xl font-bold hover:bg-slate-50">Pelajari Sampah</button>
                            </div>
                        </div>
                        <div class="lg:w-1/2">
                            <img src="https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?q=80&w=800" class="rounded-3xl shadow-2xl" alt="Hero">
                        </div>
                    </div>
                </section>
                <section class="py-20 bg-white">
                    <div class="max-w-7xl mx-auto px-4 grid grid-cols-2 md:grid-cols-4 gap-8 text-center">
                        <div><h2 class="text-4xl font-black text-emerald-600">1.2k</h2><p class="text-slate-500">Relawan</p></div>
                        <div><h2 class="text-4xl font-black text-emerald-600">15k</h2><p class="text-slate-500">Mangrove</p></div>
                        <div><h2 class="text-4xl font-black text-emerald-600">50+</h2><p class="text-slate-500">Aksi</p></div>
                        <div><h2 class="text-4xl font-black text-emerald-600">2 Ton</h2><p class="text-slate-500">Sampah</p></div>
                    </div>
                </section>
            `;
        }

        function renderProjects() {
            let cards = MOCK_PROJECTS.map(p => {
                let prog = (p.collected / p.target) * 100;
                return `
                    <div class="bg-white rounded-3xl overflow-hidden shadow-sm border border-slate-100 hover:shadow-md transition-all">
                        <img src="${p.img}" class="h-48 w-full object-cover">
                        <div class="p-6">
                            <h3 class="font-bold text-lg mb-2">${p.title}</h3>
                            <div class="flex items-center gap-2 text-xs text-slate-400 mb-4">
                                <i data-lucide="map-pin" class="w-3 h-3"></i> ${p.loc}
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full mb-4">
                                <div class="bg-emerald-600 h-2 rounded-full" style="width: ${prog}%"></div>
                            </div>
                            <div class="flex justify-between text-sm font-bold mb-6">
                                <div><span class="text-emerald-600">Rp ${p.collected.toLocaleString()}</span></div>
                                <div class="text-slate-400">Target Rp ${p.target.toLocaleString()}</div>
                            </div>
                            <button onclick="addNotification('Terima kasih! Fitur pembayaran segera hadir.')" class="w-full py-3 bg-emerald-50 text-emerald-700 font-bold rounded-xl hover:bg-emerald-100 transition-colors">Donasi</button>
                        </div>
                    </div>
                `;
            }).join('');

            return `
                <div class="pt-32 pb-20 px-4 max-w-7xl mx-auto">
                    <h2 class="text-3xl font-black mb-10 text-center">Dukung Aksi Nyata</h2>
                    <div class="grid md:grid-cols-3 gap-8">${cards}</div>
                </div>
            `;
        }

        function renderEducation() {
            return `
                <div class="pt-32 pb-20 px-4 max-w-7xl mx-auto">
                    <div class="grid lg:grid-cols-2 gap-16 items-center">
                        <div>
                            <h2 class="text-4xl font-black mb-6">Kelola Sampah, <br>Selamatkan <span class="text-emerald-600">Lingkungan</span>.</h2>
                            <div class="space-y-6">
                                <div class="p-6 bg-white rounded-2xl shadow-sm border border-emerald-50 flex gap-4">
                                    <div class="bg-emerald-50 p-3 rounded-xl text-emerald-600"><i data-lucide="trash-2"></i></div>
                                    <div><h4 class="font-bold">Pilah Sampah</h4><p class="text-sm text-slate-500">Bedakan organik dan anorganik dari rumah.</p></div>
                                </div>
                                <div class="p-6 bg-white rounded-2xl shadow-sm border border-emerald-50 flex gap-4">
                                    <div class="bg-emerald-50 p-3 rounded-xl text-emerald-600"><i data-lucide="droplets"></i></div>
                                    <div><h4 class="font-bold">Kompos Mandiri</h4><p class="text-sm text-slate-500">Ubah sisa dapur menjadi pupuk bernilai.</p></div>
                                </div>
                            </div>
                        </div>
                        <img src="https://images.unsplash.com/photo-1595273670150-db0a3d39074f?q=80&w=600" class="rounded-3xl shadow-lg">
                    </div>
                </div>
            `;
        }

        function renderAuth(isRegister) {
            return `
                <div class="pt-40 pb-20 flex justify-center px-4">
                    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
                        <div class="text-center mb-8">
                            <h2 class="text-2xl font-bold">${isRegister ? 'Gabung Member' : 'Masuk Akun'}</h2>
                            <p class="text-slate-500 text-sm mt-2">Mulai aksi hijaumu hari ini.</p>
                        </div>
                        <form onsubmit="handleAuth(event, '${isRegister ? 'reg' : 'login'}')" class="space-y-4">
                            ${isRegister ? '<div><label class="block text-xs font-bold text-slate-400 mb-1">NAMA LENGKAP</label><input id="auth-name" required type="text" class="w-full p-4 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 border-none"></div>' : ''}
                            <div><label class="block text-xs font-bold text-slate-400 mb-1">EMAIL</label><input id="auth-email" required type="email" class="w-full p-4 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 border-none"></div>
                            <div><label class="block text-xs font-bold text-slate-400 mb-1">PASSWORD</label><input required type="password" class="w-full p-4 bg-slate-50 rounded-xl outline-none focus:ring-2 focus:ring-emerald-500 border-none"></div>
                            <button class="w-full bg-emerald-600 text-white py-4 rounded-xl font-bold shadow-lg shadow-emerald-100 hover:bg-emerald-700">${isRegister ? 'Daftar' : 'Masuk'}</button>
                        </form>
                        <p class="text-center mt-6 text-sm text-slate-500">
                            ${isRegister ? 'Sudah punya akun?' : 'Belum punya akun?'} 
                            <button onclick="navigateTo('${isRegister ? 'login' : 'register'}')" class="text-emerald-600 font-bold">${isRegister ? 'Login' : 'Daftar'}</button>
                        </p>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            if(!currentUser) return navigateTo('login');
            return `
                <div class="pt-32 pb-20 px-4 max-w-7xl mx-auto">
                    <div class="flex flex-col md:row justify-between items-center mb-10 gap-4">
                        <div>
                            <h2 class="text-3xl font-black">Halo, ${currentUser.name}!</h2>
                            <p class="text-slate-500">ID Member: AH-${Math.floor(Math.random()*9000)+1000}</p>
                        </div>
                        <button onclick="logout()" class="text-red-500 font-bold flex items-center gap-2 bg-red-50 px-4 py-2 rounded-xl"><i data-lucide="log-out" class="w-4 h-4"></i> Keluar</button>
                    </div>
                    <div class="grid md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white p-8 rounded-3xl border border-slate-100"><p class="text-slate-400 text-xs font-bold mb-2">DONASI</p><h3 class="text-2xl font-black">Rp 0</h3></div>
                        <div class="bg-white p-8 rounded-3xl border border-slate-100"><p class="text-slate-400 text-xs font-bold mb-2">AKSI DIIKUTI</p><h3 class="text-2xl font-black">0</h3></div>
                        <div class="bg-white p-8 rounded-3xl border border-slate-100"><p class="text-slate-400 text-xs font-bold mb-2">POIN HIJAU</p><h3 class="text-2xl font-black text-emerald-600">0 Poin</h3></div>
                    </div>
                    <div class="bg-white p-12 rounded-3xl border border-slate-100 text-center">
                        <div class="bg-slate-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-slate-300"><i data-lucide="activity"></i></div>
                        <p class="text-slate-500">Belum ada riwayat aksi. Ayo mulai donasi!</p>
                    </div>
                </div>
            `;
        }

        // --- AUTH & ACTIONS ---
        function handleAuth(e, type) {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const name = type === 'reg' ? document.getElementById('auth-name').value : 'Member Hijau';
            
            currentUser = { email, name };
            localStorage.setItem('aksi_hijau_user', JSON.stringify(currentUser));
            
            addNotification(`Selamat datang, ${name}!`);
            navigateTo('dashboard');
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('aksi_hijau_user');
            addNotification('Berhasil keluar akun.');
            navigateTo('home');
        }

        // --- UTILS ---
        function updateNavbar() {
            const nav = document.getElementById('desktop-nav');
            const mobile = document.getElementById('mobile-menu');
            
            const commonMenu = `
                <button onclick="navigateTo('home')" class="text-sm font-medium hover:text-emerald-600">Beranda</button>
                <button onclick="navigateTo('projects')" class="text-sm font-medium hover:text-emerald-600">Proyek</button>
                <button onclick="navigateTo('education')" class="text-sm font-medium hover:text-emerald-600">Edukasi</button>
            `;

            const authMenu = currentUser 
                ? `<button onclick="navigateTo('dashboard')" class="bg-emerald-50 text-emerald-700 px-5 py-2 rounded-full text-sm font-bold flex items-center gap-2"><i data-lucide="user" class="w-4 h-4"></i> Dashboard</button>`
                : `
                    <button onclick="navigateTo('login')" class="text-sm font-medium">Masuk</button>
                    <button onclick="navigateTo('register')" class="bg-emerald-600 text-white px-6 py-2.5 rounded-full text-sm font-bold shadow-lg shadow-emerald-100">Daftar</button>
                `;

            nav.innerHTML = commonMenu + authMenu;
            mobile.innerHTML = `
                <div class="flex flex-col gap-4">
                    ${commonMenu}
                    <div class="pt-4 border-t border-slate-50">
                        ${authMenu}
                    </div>
                </div>
            `;
            
            lucide.createIcons();
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            const icon = document.getElementById('menu-icon');
            isMenuOpen = !isMenuOpen;
            
            if(isMenuOpen) {
                menu.classList.remove('hidden');
                icon.setAttribute('data-lucide', 'x');
            } else {
                menu.classList.add('hidden');
                icon.setAttribute('data-lucide', 'menu');
            }
            lucide.createIcons();
        }

        function addNotification(msg) {
            const container = document.getElementById('notification-container');
            const id = Date.now();
            const el = document.createElement('div');
            el.className = 'bg-slate-900 text-white px-6 py-4 rounded-2xl shadow-2xl flex items-center gap-3 page-transition';
            el.innerHTML = `<i data-lucide="check-circle" class="text-emerald-500 w-5 h-5"></i> <span class="text-sm font-medium">${msg}</span>`;
            
            container.appendChild(el);
            lucide.createIcons();
            
            setTimeout(() => {
                el.style.opacity = '0';
                el.style.transform = 'translateX(-20px)';
                setTimeout(() => el.remove(), 400);
            }, 3000);
        }

        // Initialize App
        window.onload = () => {
            navigateTo('home');
        };
    </script>
</body>
</html>
